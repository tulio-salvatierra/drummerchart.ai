<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drummer Chart AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315120F'/%3E%3Crect x='6' y='8' width='3' height='16' fill='%23C6A15B'/%3E%3Crect x='12' y='14' width='2' height='10' fill='%23C6A15B'/%3E%3Crect x='17' y='14' width='2' height='10' fill='%23C6A15B'/%3E%3Crect x='22' y='8' width='3' height='16' fill='%23C6A15B'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="upload-page">
  <main class="upload-card">
    <h1>Drummer Chart AI</h1>
    <p class="lede">Upload a song. Get a click track with a cue before every section change.</p>
    <form id="upload-form" action="/analyze" method="post" enctype="multipart/form-data">
      <label class="file-drop" id="file-drop">
        <input type="file" name="file" id="file-input" accept=".mp3,audio/mpeg" required>
        <span id="file-name">Choose an MP3, or drop it here</span>
      </label>
      <button type="submit" id="upload-button" class="primary">Analyze song</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="fine">MP3 only, up to 20 MB and 10 minutes. Analysis takes up to a minute.</p>
  </main>
  <script src="/static/upload.js"></script>
</body>
</html>
